name: CI sintéticos
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar dataset
        run: python src/gerar_dados.py
      - name: Testar invariantes
        run: python -m unittest discover -s tests -v
